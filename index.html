<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskMate - Stay productive. Grow every day.</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="glass-wrapper">
    <header class="top-header">
      <div class="brand">
        <span class="logo-icon">🌱</span>
        <div>
          <h1>TaskMate</h1>
          <p class="subtitle">Stay productive. Grow every day. 🍃</p>
        </div>
      </div>
      <div class="header-right">
        <div class="time-badge">
          <span id="current-date">Thu, 14 Aug 2026</span>
          <span id="current-time">1:49 PM</span>
        </div>
        <button class="icon-btn" title="Settings">⚙️</button>
      </div>
    </header>

    <section class="glass-card progress-card">
      <div class="tree-display">
        <span id="tree-stage">🌳</span>
        <span id="fruit-stage">🍎</span>
      </div>
      <h2 id="progress-text">100% Completed (2/2)</h2>
      <div class="progress-bar-bg">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 100%;"></div>
      </div>
      <p class="quote-text">"Small steps grow big trees." 🌱</p>
    </section>

    <section class="glass-card form-card">
      <form id="task-form">
        <div class="input-group search-style">
          <span class="input-icon">✨</span>
          <input type="text" id="task-input" placeholder="What needs to be done?" required />
        </div>
        
        <div class="form-controls">
          <select id="priority-input">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
          </select>
          <input type="date" id="date-input" required />
          <input type="time" id="time-input" />
          <button type="submit" class="btn-primary">➕ Add Task</button>
        </div>
      </form>
    </section>

    <div class="filter-bar">
      <button class="filter-btn active" id="filter-all">🌱 All Tasks</button>
      <button class="filter-btn" id="filter-completed">✅ Completed</button>
      <button class="filter-btn" id="filter-pending">⏳ Pending</button>
    </div>

    <div class="dashboard-grid">
      <section class="task-section">
        <ul id="task-list" class="task-list"></ul>
      </section>

      <aside class="sidebar-section">
        <div class="glass-card calendar-card">
          <div class="calendar-header">
            <h3 id="cal-month-year">August 2026</h3>
            <div class="cal-nav">
              <button id="prev-month">&lt;</button>
              <button id="next-month">&gt;</button>
            </div>
          </div>
          <div class="calendar-weekdays">
            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
          </div>
          <div id="calendar-days" class="calendar-days"></div>
        </div>

        <div class="glass-card overview-card">
          <div class="overview-header">
            <h3>☀️ Today's Tasks</h3>
            <span id="overview-subtitle" class="sub-info">2 tasks • 2 completed</span>
          </div>
          <div class="ring-container">
            <div id="ring-display" class="ring-graphic">
              <span id="ring-text">100%</span>
            </div>
          </div>
          <ul id="today-task-mini-list" class="mini-task-list"></ul>
        </div>

        <div class="stats-row">
          <div class="glass-card stat-card">
            <span class="stat-icon">🔥</span>
            <span id="stat-total" class="stat-num">2</span>
            <span class="stat-label">Total Tasks</span>
          </div>
          <div class="glass-card stat-card">
            <span class="stat-icon">✅</span>
            <span id="stat-completed" class="stat-num">2</span>
            <span class="stat-label">Completed</span>
          </div>
          <div class="glass-card stat-card">
            <span class="stat-icon">⏰</span>
            <span id="stat-pending" class="stat-num">0</span>
            <span class="stat-label">Pending</span>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
