<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskMate - Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>TaskMate 🌱</h1>
      <div class="tree-container">
        <div id="tree-stage">🌱</div>
        <p id="progress-text">0% Completed (0/0)</p>
      </div>
    </header>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="What needs to be done?" required />
      
      <div class="form-row">
        <select id="priority-input">
          <option value="Low">Low Priority</option>
          <option value="Medium" selected>Medium Priority</option>
          <option value="High">High Priority</option>
        </select>

        <input type="date" id="date-input" required />
        <input type="time" id="time-input" />
      </div>

      <button type="submit">Add Task</button>
    </form>

    <main>
      <div class="filter-container">
        <label for="filter-date">Filter by Date:</label>
        <input type="date" id="filter-date" />
        <button id="clear-filter-btn">Show All</button>
      </div>

      <ul id="task-list"></ul>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
